<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang liên hệ</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f7d9de;
      --pink-light: #fdf1ec;
      --pink-dark: #e8b8c2;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--pink-light);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h2 {
      color: #2c3e50;
      margin-top: 0;
      font-weight: 700;
    }
    .contact-info, .contact-form, .map {
      background: #fff;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .contact-info p {
      margin: 8px 0;
      font-size: 15px;
    }
    .contact-info a {
      color: var(--pink-dark);
      text-decoration: none;
      font-weight: 500;
    }
    .contact-info a:hover {
      text-decoration: underline;
    }
    .contact-form label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
      color: #34495e;
    }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: 'Montserrat', sans-serif;
    }
    .contact-form input:focus, .contact-form textarea:focus {
      border-color: var(--pink-dark);
      outline: none;
    }
    .contact-form button {
      margin-top: 15px;
      padding: 12px 25px;
      background: var(--pink-light);
      border: none;
      border-radius: 6px;
      color: var(--pink-dark);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
    }
    .contact-form button:hover {
      background: var(--pink);
      color: #000;
    }
    iframe {
      width: 100%;
      height: 350px;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Thông tin liên hệ -->
    <div class="contact-info">
      <h2>Thông tin liên hệ</h2>
      <p>📍 Địa chỉ: 12 P. Chùa Bộc, Kim Liên, Hà Nội 100000, Việt Nam</p>
      <p>📞 Điện thoại: <a href="tel:0366341691">0366341691</a></p>
      <p>✉️ Email: <a href="mailto:nettoclothes@gmail.com">nettoclothes@gmail.com</a></p>
    </div>

    <!-- Form liên hệ -->
    <div class="contact-form">
      <h2>Liên hệ với chúng tôi</h2>
      <form>
        <label>Họ và tên:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Nội dung:</label>
        <textarea name="message" rows="5" required></textarea>

        <button type="submit">Gửi liên hệ</button>
      </form>
    </div>

    <!-- Bản đồ -->
    <div class="map">
      <h2>Bản đồ</h2>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.6202519451745!2d105.82535447402695!3d21.007854188498705!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac806cfc0845%3A0x3848505bd3b9490f!2zMTIgUC4gQ2jDuWEgQuG7mWMsIEtpbSBMacOqbiwgSMOgIE7hu5lpIDEwMDAwMCwgVmnhu4d0IE5hbQ!5e0!3m2!1svi!2s!4v1791174756533!5m2!1svi!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>
</body>
</html>
