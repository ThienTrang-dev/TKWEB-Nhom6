<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="../assets/css/main.css/form.css" />
    <script>
      if (location.search.indexOf("modal=1") !== -1) {
        document.documentElement.classList.add("in-modal");
      }
    </script>
  </head>
  <body>
    <div class="auth-box">
      <h1>NETTO</h1>

      <div class="auth-tabs">
        <button type="button" id="tab-login" class="active">Đăng nhập</button>
        <button type="button" id="tab-register">Đăng ký</button>
      </div>
      <form id="form-login" class="auth-form">
        <label for="login-user">Tên đăng nhập</label>
        <input
          type="text"
          id="login-user"
          placeholder="Nhập tên đăng nhập"
          required
        />
        <p class="loi" id="login-user-err" hidden></p>

        <label for="login-pass">Mật khẩu</label>
        <div class="o-mk">
          <input
            type="password"
            id="login-pass"
            placeholder="Nhập mật khẩu"
            required
          />
          <button type="button" class="eye" data-target="login-pass">👁</button>
        </div>
        <p class="loi" id="login-pass-err" hidden></p>

        <button type="submit" class="btn-submit">Đăng nhập</button>
        <div class="auth-phu">
          <span
            >Chưa có tài khoản? <a href="#" id="den-dang-ky">Đăng ký</a></span
          >
          <a href="#" class="quen-mk" id="quen-mk">Quên mật khẩu?</a>
        </div>
      </form>

      <form id="form-register" class="auth-form" hidden>
        <label for="reg-user">Tên đăng nhập</label>
        <input
          type="text"
          id="reg-user"
          placeholder="Nhập tên đăng nhập"
          required
        />
        <p class="loi" id="reg-user-err" hidden></p>

        <label for="reg-pass">Mật khẩu</label>
        <div class="o-mk">
          <input
            type="password"
            id="reg-pass"
            placeholder="Ít nhất 6 ký tự"
            required
          />
          <button type="button" class="eye" data-target="reg-pass">👁</button>
        </div>
        <p class="loi" id="reg-pass-err" hidden></p>

        <label for="reg-q1">Câu hỏi bảo mật 1</label>
        <input
          type="text"
          id="reg-q1"
          placeholder="Tự nhập, VD: Tên thú cưng của bạn?"
          required
        />
        <input type="text" id="reg-a1" placeholder="Đáp án" required />

        <label for="reg-q2">Câu hỏi bảo mật 2</label>
        <input
          type="text"
          id="reg-q2"
          placeholder="Tự nhập, VD: Trường cấp 1 của bạn?"
          required
        />
        <input type="text" id="reg-a2" placeholder="Đáp án" required />
        <p class="loi" id="reg-q-err" hidden></p>

        <label class="dong-y">
          <input type="checkbox" id="reg-dongy" required />
          <span
            >Tôi đồng ý với tất cả các
            <a href="chinh-sach.html" target="_top"
              >chính sách và điều khoản</a
            ></span
          >
        </label>
        <button type="submit" class="btn-submit">Đăng ký</button>
      </form>

      <form id="form-forgot" class="auth-form" hidden>
        <p class="auth-tieude">Quên mật khẩu</p>
        <p class="auth-mota" id="forgot-mota">
          Nhập tên đăng nhập để lấy lại câu hỏi bảo mật.
        </p>

        <div class="khoi" id="forgot-b1">
          <label for="forgot-user">Tên đăng nhập</label>
          <input
            type="text"
            id="forgot-user"
            placeholder="Nhập tên đăng nhập của bạn"
          />
        </div>

        <div class="khoi" id="forgot-b2" hidden>
          <label id="forgot-q1"></label>
          <input type="text" id="forgot-a1" placeholder="Đáp án" />
          <label id="forgot-q2"></label>
          <input type="text" id="forgot-a2" placeholder="Đáp án" />
          <label for="forgot-newpass">Mật khẩu mới</label>
          <div class="o-mk">
            <input
              type="password"
              id="forgot-newpass"
              placeholder="Ít nhất 6 ký tự"
            />
            <button type="button" class="eye" data-target="forgot-newpass">
              👁
            </button>
          </div>
        </div>

        <p class="loi" id="forgot-err" hidden></p>
        <p class="auth-thongbao" id="forgot-msg" hidden></p>
        <button type="submit" class="btn-submit" id="forgot-btn">
          Tiếp tục
        </button>
        <div class="auth-phu">
          <a href="#" id="forgot-back">&larr; Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
    <script src="../assets/js/form.js"></script>
    <script>
      if (window.parent !== window) {
        const hop = document.querySelector(".auth-box");
        new ResizeObserver(function () {
          parent.postMessage(
            { netto: "auth-height", h: hop.offsetHeight },
            "*",
          );
        }).observe(hop);
      }
    </script>
  </body>
</html>
