<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="../assets/css/main.css/form.css" />
    <script>
      if (location.search.indexOf("modal=1") !== -1) {
        document.documentElement.classList.add("in-modal");
      }
    </script>
  </head>
  <body>
    <div class="auth-box">
      <h1>NETTO</h1>

      <div class="auth-tabs">
        <button type="button" id="tab-login" class="active">Đăng nhập</button>
        <button type="button" id="tab-register">Đăng ký</button>
      </div>
      <form id="form-login" class="auth-form">
        <label for="login-user">Tên đăng nhập</label>
        <input
          type="text"
          id="login-user"
          placeholder="Nhập tên đăng nhập"
          required
        />
        <br />
        <label for="login-pass">Mật khẩu</label>
        <input
          type="password"
          id="login-pass"
          placeholder="Nhập mật khẩu"
          required
        />
        <br />
        <button type="submit" class="btn-submit">Đăng nhập</button>
        <div class="auth-phu">
          <span
            >Chưa có tài khoản? <a href="#" id="den-dang-ky">Đăng ký</a></span
          >
          <a href="#" class="quen-mk" id="quen-mk">Quên mật khẩu?</a>
        </div>
      </form>
      <form id="form-register" class="auth-form" hidden>
        <label for="reg-user">Tên đăng nhập</label>
        <input
          type="text"
          id="reg-user"
          placeholder="Nhập tên đăng nhập"
          required
        />
        <label for="reg-pass">Mật khẩu</label>
        <input
          type="password"
          id="reg-pass"
          placeholder="Ít nhất 6 ký tự"
          minlength="6"
          required
        />
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="Nhập email" required />
        <label class="dong-y">
          <input type="checkbox" id="reg-dongy" required />
          <span
            >Tôi đồng ý với tất cả các
            <a href="chinh-sach.html" target="_top"
              >chính sách và điều khoản</a
            ></span
          >
        </label>
        <br />
        <button type="submit" class="btn-submit">Đăng ký</button>
      </form>
      <form id="form-forgot" class="auth-form" hidden>
        <p class="auth-tieude">Quên mật khẩu</p>
        <p class="auth-mota">
          Nhập email đã đăng ký, NETTO sẽ gửi hướng dẫn đặt lại mật khẩu cho
          bạn.
        </p>
        <label for="forgot-email">Email</label>
        <input
          type="email"
          id="forgot-email"
          placeholder="Nhập email của bạn"
          required
        />
        <p class="auth-thongbao" id="forgot-msg" hidden></p>
        <button type="submit" class="btn-submit">Gửi hướng dẫn</button>
        <div class="auth-phu">
          <a href="#" id="forgot-back">&larr; Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
    <script src="../assets/js/form.js"></script>
    <script>
      if (window.parent !== window) {
        const hop = document.querySelector(".auth-box");
        new ResizeObserver(function () {
          parent.postMessage(
            { netto: "auth-height", h: hop.offsetHeight },
            "*",
          );
        }).observe(hop);
      }
    </script>
  </body>
</html>
