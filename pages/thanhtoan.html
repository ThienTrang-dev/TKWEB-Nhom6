<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trang thanh toán</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #f7d9de;
        --pink-light: #fdf1ec;
        --pink-dark: #e8b8c2;
      }
      body {
        font-family: "Montserrat", sans-serif;
        background: var(--pink-light);
        margin: 0;
        padding: 20px;
      }
      .checkout-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .section {
        flex: 1;
        min-width: 280px;
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        color: #2c3e50;
        font-weight: 700;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
        color: #34495e;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        font-family: "Montserrat", sans-serif;
        transition: border-color 0.3s;
      }
      input:focus,
      textarea:focus {
        border-color: var(--pink-dark);
        outline: none;
      }
      .summary {
        background: var(--pink-light);
        border: 1px solid var(--pink-dark);
      }
      .summary p {
        margin: 8px 0;
      }
      .summary strong {
        font-size: 18px;
        color: #d35400;
      }
      .buttons {
        margin-top: 20px;
      }
      .buttons button {
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
        font-weight: 700;
        font-family: "Montserrat", sans-serif;
        text-transform: uppercase;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .back {
        background: #ccc;
        color: #333;
      }
      .confirm {
        background: var(--pink);
        color: #000;
      }
      .confirm:hover {
        background: var(--pink-dark);
        color: #fff;
      }
      .popup-dathang {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.55);
      }
      .popup-dathang-hop {
        width: 100%;
        max-width: 380px;
        padding: 32px 28px 28px;
        text-align: center;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
      }
      .popup-dathang-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: #2e7d32;
        color: #fff;
        font-size: 30px;
        line-height: 56px;
      }
      .popup-dathang-hop h3 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .popup-dathang-hop p {
        font-size: 14px;
        color: #555;
        margin: 0 0 20px;
      }
      .popup-dathang-hop button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #111;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .popup-dathang-hop button:hover {
        background: #e2543f;
      }
      .confirm:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h2>Thanh toán</h2>
    <div class="checkout-container">
      <!-- Thông tin đặt hàng -->
      <div class="section">
        <h2>Thông tin đặt hàng</h2>
        <form id="form-thongtin">
          <label>Họ và tên đệm:</label>
          <input type="text" name="lastname" required />

          <label>Tên:</label>
          <input type="text" name="firstname" required />

          <label>Email (Tùy chọn):</label>
          <input type="email" name="email" />

          <label>Địa chỉ:</label>
          <input type="text" name="address" required />

          <label>Số điện thoại:</label>
          <input type="tel" name="phone" required />

          <label>Zip code (Tùy chọn):</label>
          <input type="text" name="zipcode" />

          <label>Ghi chú (Tùy chọn):</label>
          <textarea name="note" rows="4"></textarea>
        </form>
      </div>

      <!-- Phương thức thanh toán -->
      <div class="section">
        <h2>Phương thức thanh toán</h2>
        <form>
          <input type="radio" name="payment" value="cod" checked /> Thanh toán
          khi nhận hàng<br />
          <input type="radio" name="payment" value="bank" /> Chuyển khoản ngân
          hàng
        </form>
      </div>

      <!-- Tổng giá trị -->
      <div class="section summary">
        <h2>Tổng giá trị</h2>
        <div id="cart-items">
          <!-- Sản phẩm sẽ được hiển thị ở đây -->
        </div>
        <strong id="total">Tổng: 0₫</strong>
        <div class="buttons">
          <button type="button" class="back" onclick="history.back()">
            Quay lại giỏ hàng
          </button>
          <button type="button" class="confirm" id="btn-xacnhan">
            Xác nhận
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const PHI_SHIP = 35000;
        const giaSo = function (g) {
          return Number(String(g || "").replace(/\D/g, "")) || 0;
        };
        const tien = function (n) {
          return n.toLocaleString("vi-VN") + "₫";
        };

        // Đọc giỏ hàng thật (key của cart.js, dự phòng key còn lại)
        let gio = [];
        try {
          gio =
            JSON.parse(localStorage.getItem("nettoCart")) ||
            JSON.parse(localStorage.getItem("netto_gio_hang")) ||
            [];
        } catch (e) {
          gio = [];
        }
        gio = gio.filter(function (sp) {
          return sp && sp.ten && Number(sp.soLuong) > 0;
        });

        const elItems = document.getElementById("cart-items");
        const elTotal = document.getElementById("total");
        const nutXacNhan = document.getElementById("btn-xacnhan");

        let tongHang = 0;
        let soSP = 0;

        if (gio.length === 0) {
          const p = document.createElement("p");
          p.textContent = "Giỏ hàng của bạn đang trống.";
          elItems.appendChild(p);
          elTotal.textContent = "Tổng: 0₫";
          nutXacNhan.disabled = true;
        } else {
          gio.forEach(function (sp) {
            const dongGia = giaSo(sp.gia) * Number(sp.soLuong);
            tongHang += dongGia;
            soSP += Number(sp.soLuong);

            const p = document.createElement("p");
            let chiTiet = [];
            if (sp.mau) chiTiet.push(sp.mau);
            if (sp.size) chiTiet.push(sp.size);
            p.textContent =
              sp.ten +
              (chiTiet.length ? " (" + chiTiet.join(", ") + ")" : "") +
              " x" +
              sp.soLuong +
              ": " +
              tien(dongGia);
            elItems.appendChild(p);
          });

          const ship = document.createElement("p");
          ship.textContent = "Vận chuyển: " + tien(PHI_SHIP);
          elItems.appendChild(ship);

          elTotal.textContent = "Tổng: " + tien(tongHang + PHI_SHIP);
        }

        // Ghi đơn cho tài khoản đang đăng nhập (khách chưa đăng nhập thì bỏ qua)
        function ghiDon() {
          try {
            const user = localStorage.getItem("netto_current");
            const users = JSON.parse(
              localStorage.getItem("netto_users") || "{}",
            );
            if (!user || !users[user]) return;
            users[user].donHang = users[user].donHang || [];
            users[user].donHang.push({
              ma: "DH" + Date.now(),
              ngay: new Date().toISOString(),
              tong: tongHang, // tổng tiền hàng, chưa tính phí ship
              soSP: soSP,
            });
            localStorage.setItem("netto_users", JSON.stringify(users));
          } catch (e) {}
        }

        function hienThongBao() {
          const nen = document.createElement("div");
          nen.className = "popup-dathang";
          nen.innerHTML =
            '<div class="popup-dathang-hop">' +
            '<div class="popup-dathang-icon">✓</div>' +
            "<h3>Đặt hàng thành công!</h3>" +
            "<p>Cảm ơn bạn đã mua sắm tại NETTO. Chúng tôi sẽ liên hệ xác nhận đơn sớm nhất.</p>" +
            '<button type="button">Về trang chủ</button>' +
            "</div>";
          document.body.appendChild(nen);
          nen.querySelector("button").addEventListener("click", function () {
            window.location.href = "../index.html";
          });
        }

        nutXacNhan.addEventListener("click", function () {
          const form = document.getElementById("form-thongtin");
          if (!form.reportValidity()) return; // báo ô còn thiếu
          if (gio.length === 0) return;

          ghiDon();
          localStorage.removeItem("nettoCart");
          localStorage.removeItem("netto_gio_hang");
          nutXacNhan.disabled = true;
          hienThongBao();
        });
      })();
    </script>
  </body>
</html>
