<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang thanh toán</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f7d9de;
      --pink-light: #fdf1ec;
      --pink-dark: #e8b8c2;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--pink-light);
      margin: 0;
      padding: 20px;
    }
    .checkout-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .section {
      flex: 1;
      min-width: 280px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      font-weight: 700;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
      color: #34495e;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus {
      border-color: var(--pink-dark);
      outline: none;
    }
    .summary {
      background: var(--pink-light);
      border: 1px solid var(--pink-dark);
    }
    .summary p {
      margin: 8px 0;
    }
    .summary strong {
      font-size: 18px;
      color: #d35400;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      transition: background 0.3s, color 0.3s;
    }
    .back {
      background: #ccc;
      color: #333;
    }
    .confirm {
      background: var(--pink);
      color: #000;
    }
    .confirm:hover {
      background: var(--pink-dark);
      color: #fff;
    }
  </style>
</head>
<body>
  <h2>Thanh toán</h2>
  <div class="checkout-container">
    <!-- Thông tin đặt hàng -->
    <div class="section">
      <h2>Thông tin đặt hàng</h2>
      <form>
        <label>Họ và tên đệm:</label>
        <input type="text" name="lastname" required>

        <label>Tên:</label>
        <input type="text" name="firstname" required>

        <label>Email (Tùy chọn):</label>
        <input type="email" name="email">

        <label>Địa chỉ:</label>
        <input type="text" name="address" required>

        <label>Số điện thoại:</label>
        <input type="tel" name="phone" required>

        <label>Zip code (Tùy chọn):</label>
        <input type="text" name="zipcode">

        <label>Ghi chú (Tùy chọn):</label>
        <textarea name="note" rows="4"></textarea>
      </form>
    </div>

    <!-- Phương thức thanh toán -->
    <div class="section">
      <h2>Phương thức thanh toán</h2>
      <form>
        <input type="radio" name="payment" value="cod" checked> Thanh toán khi nhận hàng<br>
        <input type="radio" name="payment" value="bank"> Chuyển khoản ngân hàng
      </form>
    </div>

    <!-- Tổng giá trị -->
    <div class="section summary">
      <h2>Tổng giá trị</h2>
      <div id="cart-items">
        <!-- Sản phẩm sẽ được hiển thị ở đây -->
      </div>
      <strong id="total">Tổng: 0₫</strong>
      <div class="buttons">
        <button class="back" onclick="window.location.href='giohang.html'">Quay lại giỏ hàng</button>
        <button class="confirm">Xác nhận</button>
      </div>
    </div>
  </div>

  <script>
    // Ví dụ dữ liệu giỏ hàng (sẽ thay bằng dữ liệu thực tế từ giỏ hàng)
    const cart = [
      { name: "Áo thun nữ", price: 150000 },
      { name: "Quần jeans nam", price: 350000 }
    ];

    const cartItemsDiv = document.getElementById("cart-items");
    const totalDiv = document.getElementById("total");

    let total = 0;
    cart.forEach(item => {
      const p = document.createElement("p");
      p.textContent = `${item.name}: ${item.price.toLocaleString()}₫`;
      cartItemsDiv.appendChild(p);
      total += item.price;
    });

    // giả sử phí vận chuyển cố định
    const shipping = 35000;
    const shippingP = document.createElement("p");
    shippingP.textContent = `Vận chuyển: ${shipping.toLocaleString()}₫`;
    cartItemsDiv.appendChild(shippingP);

    total += shipping;
    totalDiv.textContent = `Tổng: ${total.toLocaleString()}₫`;
  </script>
</body>
</html>
