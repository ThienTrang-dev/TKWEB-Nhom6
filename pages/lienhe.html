<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETTO - Thời trang nữ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link CSS riêng của trang liên hệ -->
    <link rel="stylesheet" href="../assets/css/main.css/style.css">
    <link rel="stylesheet" href="../assets/css/main.css/lienhe.css">
</head>
<body>

    <!-- Header dùng chung của nhóm -->
    <div id="site-header"></div>

    <!-- Nội dung chính của trang liên hệ -->
    <main class="container">
        <div class="contact-wrapper">
            
            <!-- CỘT TRÁI: Thông tin cửa hàng & Form nhập thông tin -->
            <div class="contact-left">
                
                <!-- Thông tin liên hệ -->
                <div class="info-section">
                    <h3 class="section-title">NETTO CLOTHES</h3>
                    <div class="info-list">
                        <div class="info-item">
                            <span>📍</span> <strong>Địa chỉ:</strong> 12 Chùa Bộc, Đống Đa, Hà Nội
                        </div>
                        <div class="info-item">
                            <span>✉️</span> <strong>Email:</strong> <a href="mailto:nettoclothes@gmail.com">nettoclothes@gmail.com</a>
                        </div>
                        <div class="info-item">
                            <span>📞</span> <strong>Hotline:</strong> <a href="tel:0817923001">0817923001</a>
                        </div>
                    </div>
                </div>

                <!-- Form liên hệ -->
                <div class="form-section">
                    <h3 class="section-title">LIÊN HỆ VỚI CHÚNG TÔI</h3>
                    <form class="contact-form" action="#" method="POST">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Họ và tên" required>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" name="phone" placeholder="Điện thoại*">
                        </div>
                        <div class="form-group">
                            <textarea name="message" rows="5" placeholder="Nội dung" required></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Gửi thông tin</button>
                    </form>
                </div>

            </div>

            <!-- CỘT PHẢI: Bản đồ Google Maps -->
            <div class="map-container">
                <iframe 
                    title="Bản đồ Netto Clothes"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.6202519451745!2d105.82535447402695!3d21.007854188498705!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac806cfc0845%3A0x3848505bd3b9490f!2zMTIgUC4gQ2jDuWEgQuG7mWMsIEtpbSBMioAnbiwgSMOgIE7hu5lpIDEwMDAwMCwgVmnhu4d0IE5hbQ!5e0!3m2!1svi!2s!4v1791174756533!5m2!1svi!2s" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

        </div>
    </main>

    <!-- Footer dùng chung của nhóm -->
    <div id="site-footer"></div>

    <!-- JavaScript điều hướng chung -->
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
